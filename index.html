<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مخطط الترقيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{font-family:Tajawal,"Segoe UI",sans-serif;color:#232323;background:#fafaf8}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:38px auto;padding:0 24px}header,.toolbar,.bottom,.tabs{display:flex;align-items:center;justify-content:space-between;gap:12px}header{margin-bottom:30px}h1{font-size:24px;font-weight:600;margin:0}.sub{font-size:13px;color:#888;margin-top:5px}button,select,input{font:inherit;border:1px solid #e6e4df;border-radius:9px;background:#fff;color:#222;padding:10px 12px}button{cursor:pointer}button:hover{border-color:#b89b64}.primary{background:#b69b6d;color:white;border-color:#b69b6d}.toolbar{flex-wrap:wrap;margin-bottom:15px}.tools{display:flex;gap:8px;flex-wrap:wrap}input[type=search]{width:min(350px,100%)}.tabs{justify-content:flex-start;border-bottom:1px solid #e9e7e3;margin-bottom:8px;gap:20px}.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:12px 2px;color:#777}.tab.active{color:#242424;border-color:#b69b6d}.tablewrap{overflow:auto;min-height:280px}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}th{text-align:right;font-weight:500;color:#777;font-size:13px}td,th{padding:14px 11px;border-bottom:1px solid #eeece8}td:last-child,th:last-child{text-align:left}.bottom{border-top:1px solid #eee;padding-top:16px;color:#777;font-size:13px}.link{border:0;background:none;color:#777;padding:6px}.status{border:1px solid #e9e6df;padding:6px 8px;font-size:12px;border-radius:7px;background:white}.dialog{border:1px solid #e9e7e3;border-radius:14px;max-width:470px;width:calc(100% - 30px);padding:24px;box-shadow:0 15px 50px #0002}.dialog::backdrop{background:#0005}.form{display:grid;gap:12px}.form label{display:grid;gap:5px;font-size:13px;color:#666}.form input{width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.note{font-size:12px;color:#777}.summary{font-size:13px;color:#777;margin:14px 0 24px}.empty{height:230px}.rowbtn{border:0;background:none;text-decoration:underline;text-decoration-color:#ddd;padding:2px}#notice{position:fixed;bottom:20px;left:20px;background:#272727;color:#fff;padding:11px 18px;border-radius:9px;display:none;max-width:90vw}@media(max-width:600px){main{margin:22px auto;padding:0 14px}header{margin-bottom:22px}h1{font-size:21px}.toolbar{align-items:stretch}input[type=search]{width:100%}.tools{width:100%}.tools>*{flex:1}.tablewrap{min-height:220px}}
</style></head><body><main>
<header><div><h1>مخطط الترقيات</h1><div class="sub">2027 – 2031</div></div><button class="link" id="settingsBtn">الإعدادات</button></header>
<div class="toolbar"><div class="tools"><select id="year" aria-label="السنة"><option>2027</option><option>2028</option><option>2029</option><option>2030</option><option>2031</option></select><button class="primary" id="importBtn">استيراد Excel</button><button id="exportBtn">تصدير Excel</button></div><input type="search" id="search" placeholder="بحث" aria-label="بحث"></div>
<div class="tabs"><button class="tab active" data-filter="all">الكل</button><button class="tab" data-filter="due">المستحقون</button><button class="tab" data-filter="approved">المعتمدون</button></div>
<div class="tablewrap"><table><thead><tr><th>الموظف</th><th>الدرجة الحالية</th><th>الدرجة المتوقعة</th><th>تاريخ الاستحقاق</th><th>الزيادة الشهرية</th><th>الحالة</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="summary" id="summary"></div><div class="bottom"><span id="count"></span><button class="link" id="backupBtn">نسخة احتياطية</button></div>
<input hidden type="file" id="file" accept=".xlsx,.xls,.csv"><input hidden type="file" id="restore" accept=".json">
</main>
<dialog class="dialog" id="settings"><form method="dialog" class="form"><h3>الإعدادات</h3><label>دورة الترقية (سنوات)<input id="cycle" type="number" min="1" max="30"></label><label>فروق الدرجات (ريال عماني، JSON)<textarea id="gradeDiffs" rows="5" style="font:inherit;direction:ltr;border:1px solid #ddd;border-radius:8px;padding:8px"></textarea></label><div class="actions"><button value="cancel">إلغاء</button><button class="primary" id="saveSettings" value="save">حفظ</button></div></form></dialog>
<dialog class="dialog" id="edit"><form method="dialog" class="form"><h3 id="editTitle"></h3><label>الحالة<select id="editStatus"><option value="متوقع">متوقع</option><option value="معتمد">معتمد</option><option value="منفذ">منفذ</option><option value="مؤجل">مؤجل</option></select></label><div class="actions"><button value="cancel">إلغاء</button><button class="primary" value="save" id="saveEdit">حفظ</button></div></form></dialog>
<div id="notice" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
"use strict";
const KEY="promotion-planner-v1", DEFAULT_DIFF={1:150,2:130,3:90,4:65,5:35,6:50,7:50,8:125,9:35,10:65,11:75,12:30,13:10,14:20,15:19,16:20,17:0};
let state={employees:[],cycle:4,diffs:DEFAULT_DIFF},filter="all",selected=null;
const $=id=>document.getElementById(id);
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.employees))state={...state,...saved}}catch{}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{notify("تعذر حفظ البيانات");return false}};
function notify(s){const n=$("notice");n.textContent=s;n.style.display="block";clearTimeout(notify.timer);notify.timer=setTimeout(()=>n.style.display="none",3500)}
const normalize=s=>String(s??"").replace(/[\u064b-\u065f\u0670\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").toLowerCase();
function parseDate(x){if(x instanceof Date)return Number.isFinite(+x)?x:null;if(typeof x==="number"&&window.XLSX){const d=XLSX.SSF.parse_date_code(x);return d?new Date(d.y,d.m-1,d.d):null}const s=String(x??"").trim();let m=s.match(/^(\d{4})[-\/]([01]?\d)[-\/]([0-3]?\d)/);if(m)return checkedDate(+m[1],+m[2],+m[3]);m=s.match(/^([0-3]?\d)[-\/]([01]?\d)[-\/](\d{4})/);if(m)return checkedDate(+m[3],+m[2],+m[1]);return null}
function checkedDate(y,m,d){const t=new Date(y,m-1,d);return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d?t:null}
function dueDate(e){const d=parseDate(e.last);if(!d)return null;const next=new Date(d);next.setFullYear(d.getFullYear()+Number(state.cycle||4));return next}
function events(){let out=[];for(const e of state.employees){const first=dueDate(e);if(!first)continue;let current=Number(e.grade);for(let i=0;i<20;i++){const d=new Date(first);d.setFullYear(first.getFullYear()+i*Number(state.cycle));if(d.getFullYear()>2031)break;if(d.getFullYear()<2027){current=Math.max(1,current-1);continue}const next=Math.max(1,current-1);const id=e.id+"|"+d.getFullYear()+"|"+d.toISOString().slice(0,10);out.push({e,date:d,grade:current,next,amount:current>1?Number(state.diffs[current]??0):0,id,status:e.statuses?.[id]||"متوقع"});current=next;if(current===1)break}}return out}
function render(){const y=Number($("year").value),q=normalize($("search").value);const rows=events().filter(r=>r.date.getFullYear()===y&&(filter==="all"||filter==="due"&&r.status==="متوقع"||filter==="approved"&&["معتمد","منفذ"].includes(r.status))&&normalize(r.e.name+" "+r.e.id+" "+r.grade).includes(q));const body=$("rows");body.replaceChildren();for(const r of rows){const tr=document.createElement("tr");for(const v of [r.e.name,r.grade,r.next,r.date.toLocaleDateString("en-GB"),r.amount.toFixed(3)]){const td=document.createElement("td");td.textContent=v;tr.append(td)}const td=document.createElement("td"),btn=document.createElement("button");btn.className="rowbtn";btn.textContent=r.status;btn.onclick=()=>{selected=r;$("editTitle").textContent=r.e.name;$("editStatus").value=r.status;$("edit").showModal()};td.append(btn);tr.append(td);body.append(tr)}$("count").textContent=rows.length+" موظف";$("summary").textContent=rows.length?"الزيادة الشهرية: "+rows.reduce((s,r)=>s+r.amount,0).toFixed(3)+" ر.ع":""}
function cell(row,names){for(const n of names){const k=Object.keys(row).find(k=>normalize(k).replace(/\s+/g,"").includes(normalize(n).replace(/\s+/g,"")));if(k&&row[k]!==undefined&&row[k]!==null)return row[k]}return ""}
function importRows(data){if(!Array.isArray(data)||!data.length){notify("الملف فارغ");return}let next=[],skipped=0;const previous=new Map(state.employees.map(e=>[e.id,e]));for(const row of data){const name=String(cell(row,["اسم الموظف","الاسم","employee name","name"])).trim();const last=cell(row,["تاريخ آخر ترقية","تاريخ اخر ترقية","last promotion","promotion date"]);const grade=Number(cell(row,["الدرجة الحالية","الدرجة","current grade","grade"]));const date=parseDate(last);if(!name||!date||!Number.isInteger(grade)||grade<1||grade>17){skipped++;continue}const id=String(cell(row,["الرقم الوظيفي","رقم الموظف","employee id","employee number"])||name).trim();next.push({id,name,grade,last:[date.getFullYear(),String(date.getMonth()+1).padStart(2,"0"),String(date.getDate()).padStart(2,"0")].join("-"),statuses:previous.get(id)?.statuses||{}})}if(!next.length){notify("لم يتم العثور على بيانات صالحة");return}const ids=new Set();next=next.filter(e=>{if(ids.has(e.id)){skipped++;return false}ids.add(e.id);return true});if(state.employees.length&&!confirm("استبدال قائمة الموظفين الحالية؟ ستبقى الحالات المحفوظة للأرقام الوظيفية المطابقة."))return;state.employees=next;if(save()){render();notify("تم استيراد "+next.length+" موظف"+(skipped?"، واستبعاد "+skipped:""))}}
$("file").onchange=async ev=>{const file=ev.target.files[0];if(!file)return;try{if(!window.XLSX){notify("تعذر تحميل قارئ Excel");return}const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});importRows(data)}catch(e){notify("تعذر قراءة الملف")}finally{ev.target.value=""}};
$("importBtn").onclick=()=>$("file").click();$("year").onchange=render;$("search").oninput=render;document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b));render()});
$("settingsBtn").onclick=()=>{$("cycle").value=state.cycle;$("gradeDiffs").value=JSON.stringify(state.diffs);$("settings").showModal()};
$("saveSettings").onclick=e=>{const cycle=Number($("cycle").value);let diffs;try{diffs=JSON.parse($("gradeDiffs").value);if(!diffs||typeof diffs!=="object"||Array.isArray(diffs)||Object.values(diffs).some(v=>!Number.isFinite(Number(v))||Number(v)<0))throw Error()}catch{e.preventDefault();notify("قيم فروق الدرجات غير صحيحة");return}if(!Number.isInteger(cycle)||cycle<1||cycle>30){e.preventDefault();notify("دورة الترقية غير صحيحة");return}state.cycle=cycle;state.diffs=diffs;save();render()};
$("saveEdit").onclick=()=>{if(!selected)return;selected.e.statuses??={};selected.e.statuses[selected.id]=$("editStatus").value;save();render()};
function download(blob,name){const a=document.createElement("a"),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$("exportBtn").onclick=()=>{const y=Number($("year").value),rows=events().filter(r=>r.date.getFullYear()===y).map(r=>({"الرقم الوظيفي":r.e.id,"اسم الموظف":r.e.name,"الدرجة الحالية":r.grade,"الدرجة المتوقعة":r.next,"تاريخ الاستحقاق":r.date.toLocaleDateString("en-GB"),"الزيادة الشهرية":r.amount,"الحالة":r.status}));if(!window.XLSX){notify("تعذر تحميل مكتبة Excel");return}const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{"اسم الموظف":""}]),"ترقيات "+y);XLSX.writeFile(wb,"PromotionPlanner_"+y+".xlsx")};
$("backupBtn").onclick=()=>download(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),"PromotionPlanner_backup.json");
render();
</script></body></html>
